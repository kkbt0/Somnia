<!DOCTYPE html>
<html lang="zh-CN">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="shortcut icon" type="image/svg+xml"
        href="data:image/svg+xml,%3Csvg%20xmlns='http://www.w3.org/2000/svg'%20viewBox='0%200%20100%20100'%3E%3Ctext%20y='.9em'%20font-size='90'%3E♾️%3C/text%3E%3C/svg%3E">
    <title>kkbt</title>
    <style>
        :root {
            --bg-light: #f9f9f9;
            --bg-dark: #181a1b;
            --card-light: #fff;
            --card-dark: #23272a;
            --text-light: #222;
            --text-dark: #eaeaea;
            --shadow-light: 0 2px 16px rgba(0, 0, 0, 0.06);
            --shadow-dark: 0 2px 16px rgba(0, 0, 0, 0.3);
            --link-light: #0078d7;
            --link-dark: #4ea1ff;
            --muted-light: #666;
            --muted-dark: #aaa
        }

        html,
        body {
            height: 100%;
            margin: 0;
            padding: 0
        }

        body {
            font-family: 'Helvetica Neue', Helvetica, Arial, sans-serif;
            background: var(--bg-light);
            color: var(--text-light);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center
        }

        .card {
            background: var(--card-light);
            padding: 2rem 3rem;
            border-radius: 12px;
            box-shadow: var(--shadow-light);
            text-align: center;
            max-width: 90vw
        }

        h1 {
            margin-bottom: 0.5em;
            font-size: 2em
        }

        p {
            margin-top: 0;
            color: var(--muted-light)
        }

        a {
            color: var(--link-light);
            text-decoration: none;
            margin: 0 0.5em;
            transition: color 0.2s
        }

        a:hover {
            text-decoration: underline
        }

        @media(prefers-color-scheme:dark) {
            body {
                background: var(--bg-dark);
                color: var(--text-dark)
            }

            .card {
                background: var(--card-dark);
                box-shadow: var(--shadow-dark)
            }

            p {
                color: var(--muted-dark)
            }

            a {
                color: var(--link-dark)
            }
        }

        @media(max-width:600px) {
            .card {
                padding: 1.2rem 0.8rem
            }

            h1 {
                font-size: 1.3em
            }
        }
    </style>
</head>

<body>
    <div class="card">
        <h1>Offline</h1>
        <p>A simple navigation page for kkbt.</p>
    </div>
</body>

</html>
