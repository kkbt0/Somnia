{{ define "main" }}
<div class='px-4 py-10 text-center sm:px-6 lg:px-8'>
    <h1 class='block text-7xl font-bold sm:text-9xl'>Somnia</h1>
    <p class='mt-3 text-muted-foreground'>Oops, something went wrong.</p>
    <p class='text-lg'>Sorry, we couldn't retrieve the page from the cache.</p>
    <a class="group inline-flex items-center gap-x-1 rounded-lg bg-muted border px-2 py-1 text-sm text-muted-foreground transition-all hover:bg-card no-underline mt-5"
        href="javascript:history.back();">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke-width="2.5" stroke-linecap="round"
            stroke-linejoin="round" class="stroke-muted-foreground group-hover:stroke-primary">
            <line x1="19" y1="12" x2="5" y2="12"
                class="translate-x-3 scale-x-0 transition-all duration-300 ease-in-out group-hover:translate-x-0 group-hover:scale-x-100">
            </line>
            <polyline points="12 19 5 12 12 5"
                class="translate-x-1 transition-all duration-300 ease-in-out group-hover:translate-x-0"></polyline>
        </svg>
        <p class="my-0">Back</p>
    </a>
</div>
{{ end }}
