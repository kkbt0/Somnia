{{with .Site.Params.websites}}
<section class="flex flex-col gap-y-5 md:flex-row md:gap-y-0">
    <div class='text-xl font-medium md:min-w-36'>
        <h2>Website List</h2>
    </div>
    <div class='flex flex-1 flex-col gap-y-3'>
        <!-- section 内容 -->
        <div class='grid grid-cols-1 gap-3 sm:grid-cols-2'>
            {{range .}}
            {{ partial "project-card.html" (dict
            "href" .url
            "heading" .name
            "subheading" .description
            "image" .image
            ) }}
            {{end}}
        </div>
    </div>
</section>
{{end}}
