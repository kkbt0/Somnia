{{if .Site.Params.certifications}}
<section class="flex flex-col gap-y-5 md:flex-row md:gap-y-0">
    <div class='text-xl font-medium md:min-w-36'>
        <h2>Certifications</h2>
    </div>
    <div class='flex flex-1 flex-col gap-y-3'>
        <!-- section 内容 -->
        {{ partial "card.html" (dict
        "heading" .Site.Params.certifications.heading
        "subheading" .Site.Params.certifications.subheading
        "date" .Site.Params.certifications.date
        "href" .Site.Params.certifications.url
        ) }}
    </div>
</section>
{{end}}
