{{if .Site.Params.education}}
<section class="flex flex-col gap-y-5 md:flex-row md:gap-y-0">
    <div class='text-xl font-medium md:min-w-36'>
        <h2>Education</h2>
    </div>
    <div class='flex flex-1 flex-col gap-y-3'>
        <!-- section 内容 -->
        {{ partial "card.html" (dict
        "heading" .Site.Params.education.heading
        "subheading" .Site.Params.education.subheading
        "date" .Site.Params.education.date
        "href" .Site.Params.education.url
        ) }}
    </div>
</section>
{{end}}
