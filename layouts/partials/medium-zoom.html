{{ if site.Params.features.mediumZoom }}
<script defer src="https://cdn.jsdelivr.net/npm/medium-zoom@1.1.0/dist/medium-zoom.min.js"></script>
<script defer>
  document.addEventListener('DOMContentLoaded', () => {
    const images = Array.from(document.querySelectorAll('#content img')).filter(img => !img.classList.contains('medium-zoom-image'));
    images.forEach(img => {
      mediumZoom(img, { background: 'rgba(0, 0, 0, 0.8)' });
    });
  });
</script>
<style>
  .medium-zoom-overlay {
    position: fixed;
    top: 0;
    right: 0;
    bottom: 0;
    left: 0;
    opacity: 0;
    transition: opacity 0.3s;
    will-change: opacity;
  }

  .medium-zoom--opened .medium-zoom-overlay {
    cursor: zoom-out;
    opacity: 1;
    z-index: 999;
  }

  .medium-zoom-image {
    cursor: zoom-in;
    transition: transform 0.3s cubic-bezier(0.2, 0, 0.2, 1);
  }

  .medium-zoom-image--hidden {
    visibility: hidden;
  }

  .medium-zoom-image--opened {
    position: relative;
    cursor: zoom-out;
    will-change: transform;
    z-index: 999;
  }
</style>

{{ end }}
