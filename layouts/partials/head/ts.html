{{ $ts := resources.Get "ts/dist/index.js" }}
{{ $custom := resources.Get "js/custom.js" }}
<script defer>
    const VERSION = 'v{{ now.Format "2006-0102-1504" }}'
</script>
{{- $jsBundle := slice }}
{{- $jsBundle = $jsBundle | append $ts }}
{{- $jsBundle = $jsBundle | append $custom }}

{{- $bundle := $jsBundle | resources.Concat "js/bundle.js" | minify | fingerprint -}}
<script defer src="{{ $bundle.RelPermalink }}" integrity="{{ $bundle.Data.Integrity }}" crossorigin="anonymous"></script>
