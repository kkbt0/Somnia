<!-- [TODO] detailed false 待实现-->
<!-- <li class="post-preview" style="--preview-highlight:color-mix(in srgb,#9698C1 40%,hsl(var(--foreground)/var(--un-text-opacity,1)));--preview-highlight-bg:hsl(from #9698C1 h s l/20%)"> -->
<li x-data="blogPreviewComponent()" class="post-preview"
    :style="`--preview-highlight:color-mix(in srgb,${heroColor} 40%,hsl(var(--foreground)/var(--un-text-opacity,1)));--preview-highlight-bg:hsl(from ${heroColor} h s l/20%)`">

    <!-- 有 cover + max-md:pt-24 -->
    <a class="block w-full relative group rounded-2xl border bg-background transition-colors ease-in-out px-5 py-2.5 hover:bg-muted hover:text-primary max-sm:px-4 sm:py-5
    {{if .Params.featuredImage}} max-md:pt-24 {{end}}" href="{{.RelPermalink}}">
        {{if .Params.featuredImage }}
        <img src="{{.Params.featuredImagePreview|default .Params.featuredImage}}" alt="{{.Title}}" loading="lazy"
            decoding="async" fetchpriority="auto"
            class="cover-image absolute end-0 top-0 z-0 h-2/3 w-full rounded-2xl object-cover opacity-50 transition-opacity duration-300 group-hover:opacity-70 md:h-full md:w-3/5">
        {{end}}
        <div class="relative flex flex-col gap-1" style="z-index:1">
            <span class="text-muted-foreground font-mono min-w-[95px] text-xs">
                <time datetime="{{ .Date }}">
                    {{.Date.Format "2006-01-02" }}
                </time>
            </span>
            <!-- title -->
            <div class='flex justify-between flex-grow'>
                <div class="font-medium">
                    <!-- <span class='text-red-500'>(Draft) </span> -->
                    {{.Title}}
                </div>
                <svg xmlns='http://www.w3.org/2000/svg' width='16' height='16' viewBox='0 0 24 24' fill='none'
                    stroke-width='2.5' stroke-linecap='round' stroke-linejoin='round'
                    class='preview-redirect my-1 stroke-muted-foreground group-hover:stroke-primary'>
                    <line x1='5' y1='12' x2='19' y2='12'
                        class='translate-x-4 scale-x-0 transition-all duration-300 ease-in-out group-hover:translate-x-1 group-hover:scale-x-100'>
                    </line>
                    <polyline points='12 5 19 12 12 19'
                        class='translate-x-0 transition-all duration-300 ease-in-out group-hover:translate-x-1'>
                    </polyline>
                </svg>
            </div>

            <!-- Detail -->
            <!-- 有 cover + sm:me-24 -->
            <p
                class="line-clamp-2 text-sm text-muted-foreground sm:line-clamp-3 {{if .Params.featuredImage}} sm:me-24 {{end}}">
                {{.Description|default "Without further ado"}}
            </p>
            <div class='py-2 flex items-center gap-2 text-sm italic leading-4 text-muted-foreground'>
                <!-- Reading time -->
                <span class='flex items-center gap-1'>
                    <svg aria-hidden="true" class="size-4" width="22" height="22" viewBox="0 0 24 24"
                        fill="currentColor" style="--sl-icon-size: 1em;">
                        <g fill="none">
                            <path
                                d="m12.593 23.258l-.011.002l-.071.035l-.02.004l-.014-.004l-.071-.035q-.016-.005-.024.005l-.004.01l-.017.428l.005.02l.01.013l.104.074l.015.004l.012-.004l.104-.074l.012-.016l.004-.017l-.017-.427q-.004-.016-.017-.018m.265-.113l-.013.002l-.185.093l-.01.01l-.003.011l.018.43l.005.012l.008.007l.201.093q.019.005.029-.008l.004-.014l-.034-.614q-.005-.018-.02-.022m-.715.002a.02.02 0 0 0-.027.006l-.006.014l-.034.614q.001.018.017.024l.015-.002l.201-.093l.01-.008l.004-.011l.017-.43l-.003-.012l-.01-.01z">
                            </path>
                            <path fill="currentColor"
                                d="M12 2c5.523 0 10 4.477 10 10s-4.477 10-10 10S2 17.523 2 12S6.477 2 12 2m0 2a8 8 0 1 0 0 16a8 8 0 0 0 0-16m0 2a1 1 0 0 1 .993.883L13 7v4.586l2.707 2.707a1 1 0 0 1-1.32 1.497l-.094-.083l-3-3a1 1 0 0 1-.284-.576L11 12V7a1 1 0 0 1 1-1">
                            </path>
                        </g>
                    </svg>
                    {{.ReadingTime}} min
                </span>
                <!-- Language -->
                {{if .Params.language}}
                <span class='flex items-center gap-1'>
                    <svg aria-hidden="true" class="size-4" width="22" height="22" viewBox="0 0 24 24"
                        fill="currentColor" style="--sl-icon-size: 1em;">
                        <g fill="none" fill-rule="evenodd">
                            <path
                                d="m12.594 23.258l-.012.002l-.071.035l-.02.004l-.014-.004l-.071-.036q-.016-.004-.024.006l-.004.01l-.017.428l.005.02l.01.013l.104.074l.015.004l.012-.004l.104-.074l.012-.016l.004-.017l-.017-.427q-.004-.016-.016-.018m.264-.113l-.014.002l-.184.093l-.01.01l-.003.011l.018.43l.005.012l.008.008l.201.092q.019.005.029-.008l.004-.014l-.034-.614q-.005-.019-.02-.022m-.715.002a.02.02 0 0 0-.027.006l-.006.014l-.034.614q.001.018.017.024l.015-.002l.201-.093l.01-.008l.003-.011l.018-.43l-.003-.012l-.01-.01z">
                            </path>
                            <path fill="currentColor"
                                d="M12 2c5.523 0 10 4.477 10 10s-4.477 10-10 10S2 17.523 2 12S6.477 2 12 2m1.482 14.94a18 18 0 0 1-2.964 0q.14.596.31 1.102c.251.755.53 1.293.79 1.622c.127.162.23.248.3.29l.051.028l.03.008l.032-.008l.051-.027a1.2 1.2 0 0 0 .3-.29c.26-.33.539-.868.79-1.623q.17-.506.31-1.102m-8.675-1.435a8.03 8.03 0 0 0 4.441 4.01a11 11 0 0 1-.318-.84a16 16 0 0 1-.52-2.033a18 18 0 0 1-3.603-1.137m14.387 0c-1.145.5-2.351.883-3.605 1.137a16 16 0 0 1-.52 2.034q-.144.437-.318.838a8.03 8.03 0 0 0 4.443-4.01Zm-5.218-4.634a15 15 0 0 1-3.952 0a26 26 0 0 0 .141 4.025a16.2 16.2 0 0 0 3.67 0A25 25 0 0 0 14 12q0-.576-.024-1.13ZM4.568 9.032a8 8 0 0 0-.52 3.856a16 16 0 0 0 4.067 1.637a28 28 0 0 1-.074-4.053a15 15 0 0 1-3.473-1.44m14.864 0a15 15 0 0 1-3.473 1.44a28 28 0 0 1-.074 4.053a16 16 0 0 0 4.066-1.637a8 8 0 0 0-.52-3.855Zm-7.416-5.02l-.011-.002l-.02.003l-.038.015a1.2 1.2 0 0 0-.33.307c-.26.33-.538.868-.79 1.622c-.27.808-.488 1.8-.633 2.919a13 13 0 0 0 3.612 0c-.145-1.12-.364-2.111-.633-2.919c-.252-.754-.53-1.293-.79-1.622a1.2 1.2 0 0 0-.3-.29l-.067-.032Zm-2.768.474a8 8 0 0 0-3.71 2.797c.843.484 1.746.876 2.695 1.163c.16-1.164.397-2.223.697-3.122q.145-.438.318-.838m5.504 0q.172.4.318.838c.3.9.537 1.958.697 3.122a13 13 0 0 0 2.695-1.163a8 8 0 0 0-3.71-2.797">
                            </path>
                        </g>
                    </svg>
                    {{.Params.language}}
                </span>
                {{end}}
            </div>
            <object title='Tags' aria-label='Tags' aria-labelledby='Tags'>
                <ul class='tag-list mt-1 flex gap-2'>
                    {{ with .Params.categories }}
                    {{ range $index, $categories := . }}
                    <li>
                        <a class="group inline-flex items-center gap-x-1 rounded-lg bg-muted border px-2 py-1 text-sm text-muted-foreground transition-all hover:bg-card no-underline rounded-xl"
                            href="{{ "categories" | relLangURL }}/{{ $categories | urlize }}">
                            <p class="my-0">{{ $categories }}</p>
                        </a>
                    </li>
                    {{ end }}
                    {{ end }}
                    {{if (and .Params.categories .Params.tags)}}{{end}}
                    {{ with .Params.tags }}
                    {{ range $index, $tag := . }}
                    <li>
                        <a class="group inline-flex items-center gap-x-1 rounded-lg bg-muted border px-2 py-1 text-sm text-muted-foreground transition-all hover:bg-card no-underline rounded-xl"
                            href="{{ "tags" | relLangURL }}/{{ $tag | urlize }}">
                            <p class="my-0">{{ $tag }}</p>
                        </a>
                    </li>
                    {{ end }}
                    {{ end }}

                </ul>
            </object>
        </div>
    </a>
</li>
<style>
    .post-preview {
        --preview-highlight-final: var(--preview-highlight, hsl(var(--primary) / var(--un-text-opacity, 1)));
    }

    .post-preview:hover {

        &>a,
        & .tag-list a {
            background-color: var(--preview-highlight-bg, hsl(var(--muted) / var(--un-bg-opacity, 1))) !important;
        }

        &>a,
        & .tag-list a:hover {
            color: var(--preview-highlight-final) !important;
        }

        &>a .preview-redirect {
            stroke: var(--preview-highlight-final) !important;
        }
    }

    .cover-image {
        mask-image: linear-gradient(to right, rgba(0, 0, 0, 0) 0%, rgba(0, 0, 0, 1) 100%);
    }

    @media (max-width: 768px) {
        .cover-image {
            mask-image: linear-gradient(to top, rgba(0, 0, 0, 0) 0%, rgba(0, 0, 0, 1) 100%);
        }
    }
    /* [Somnia-fix] 阻止图片点击放大事件 */
    .cover-image {
        pointer-events: none;
    }
</style>
