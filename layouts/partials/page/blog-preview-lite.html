<li class="post-preview border-0 bg-transparent py-2">
    <a class="block w-full relative group rounded-2xl border bg-background transition-colors ease-in-out px-5 py-2.5 hover:bg-muted hover:text-primary"
        href="{{ .RelPermalink }}">
        <div class="relative flex flex-col gap-1 sm:flex-row sm:items-center" style="z-index:1">
            <span class="text-muted-foreground font-mono min-w-[95px] text-xs">
                <time datetime="{{.Date.UTC}}">{{.Date.Format "2006-01-02"}}</time>
            </span>
            <div class="flex justify-between flex-grow">
                <div>{{ .Title }}</div>
                <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none"
                    stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"
                    class="preview-redirect my-1 stroke-muted-foreground group-hover:stroke-primary">
                    <line x1="5" y1="12" x2="19" y2="12"
                        class="translate-x-4 scale-x-0 transition-all duration-300 ease-in-out group-hover:translate-x-1 group-hover:scale-x-100">
                    </line>
                    <polyline points="12 5 19 12 12 19"
                        class="translate-x-0 transition-all duration-300 ease-in-out group-hover:translate-x-1">
                    </polyline>
                </svg>
            </div>
        </div>
    </a>
</li>
