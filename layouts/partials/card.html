{{ if .href }}
<a class="not-prose block relative rounded-2xl border bg-muted px-5 py-3 transition-all hover:border-foreground/25 hover:shadow-sm"
    href={{.href}}>
    <div class='flex flex-col gap-y-1.5'>
        <div class='flex flex-col gap-y-0.5'>
            <h2 class='text-lg font-medium'>{{ .heading }}</h2>
            <p class='text-muted-foreground'>{{.subheading}}</p>
            <p class='text-muted-foreground'>{{.date}}</p>
        </div>
        <slot />
    </div>
</a>
{{ else }}
<div class="not-prose block relative rounded-2xl border bg-muted px-5 py-3">
    <div class='flex flex-col gap-y-1.5'>
        <div class='flex flex-col gap-y-0.5'>
            <h2 class='text-lg font-medium'>{{ .heading }}</h2>
            <p class='text-muted-foreground'>{{.subheading}}</p>
            <p class='text-muted-foreground'>{{.date}}</p>
        </div>
        <slot />
    </div>
</div>
{{end}}
