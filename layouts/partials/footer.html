<footer class='mx-auto mb-5 mt-16 w-full'>
  <div class='border-t pt-5'>
    <div class='flex items-center gap-y-3 max-sm:flex-col sm:justify-between sm:gap-y-0'>
      <div class='flex items-center gap-x-4 gap-y-2 text-muted-foreground max-sm:flex-col'>
        {{if .Site.Params.footer.icp}}
        <div>
          <a href="{{.Site.Params.footer.icp.link}}" target="_blank" class="text-sm">{{.Site.Params.footer.icp.title}}</a>
        </div>
        {{end}}
        <div> © 2026 恐咖兵糖 & <span><a href="{{relURL "terms"}}" target="_blank">Site Policy</a></span>
        </div>
        {{if .Site.Params.footer.powered}}
        <span><a href="https://gohugo.io/" target="_blank">Hugo</a> & <a href="https://github.com/kkbt0/Somnia" target="_blank">Somnia</a> theme powered</span>
        {{end}}
      </div>
      <div class='flex items-center gap-x-4'>
        <a href="{{.Site.Params.author.github|default "https://github.com/kkbt0/Somnia"}}" aria-label="GitHub">
          <svg aria-hidden="true" width="22" height="22" style="--sl-icon-size: 1em;">
            <use href='{{"icons/main.svg#github"|relURL}}' />
          </svg>
        </a>
        <a href="{{relURL "index.xml"}}" aria-label="RSS" title="RSS" target="_blank">
          <svg aria-hidden="true" width="22" height="22" style="--sl-icon-size: 1em;">
            <use href='{{"icons/main.svg#rss"|relURL}}' />
          </svg>
        </a>
      </div>
    </div>
  </div>
</footer>
<style>
  footer a {
    color: hsl(var(--foreground) / var(--un-text-opacity, 1));
    text-decoration: underline;
    font-weight: 500;
  }
</style>
