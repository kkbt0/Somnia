{{$toc:=.toc}}
<!-- doc 单页使用  docs-toc block mt-3 -->
{{$type:=.type}}
<docs-toc x-data="docsTocComponent()" {{if eq .type "sidebar" }} class="not-prose docs-toc block mt-3" {{else}}
    class="not-prose" {{end}}>
    <h2 class='text-foreground font-medium'><a href='{{ "docs" | relURL }}'>Docs</a></h2>
    <!-- <span x-text="currentPath"></span> -->
    <ul class='mt-4 flex flex-col gap-y-5'>
        {{range $toc.children}}
        <li>
            <h3 class='text-muted-foreground text-xs tracking-widest uppercase'>{{.title}}</h3>
            <ul class='mt-2 flex flex-col'>
                {{range .children}}
                <li :class="{ 'docs-hl': currentPath.endsWith(`{{.link}}`) || currentPath === `/{{.link}}` }"
                    class='docs-item flex relative ms-2 px-3 py-1 text-foreground/75 transition-all rounded-2xl'>
                    <!-- -->
                    <a class='flex-1 hover:text-foreground' href="{{relURL .link}}">
                        {{.title}}
                    </a>
                </li>
                {{end}}
            </ul>
        </li>
        {{end}}
    </ul>
</docs-toc>
<style>
    docs-toc .docs-item::before {
        content: '';
        display: block;
        position: absolute;
        top: 5%;
        bottom: 5%;
        left: -0.5rem;
        width: 2px;
        background-color: hsl(var(--input) / var(--un-bg-opacity));
    }

    docs-toc .docs-item.docs-hl {
        background-color: hsl(var(--muted) / var(--un-bg-opacity));
        font-weight: 500;

        & a {
            /* color: hsl(var(--primary) / var(--un-text-opacity)); */
            /* [Somnia-fix] doc aside style */
            --highlight-fg: color-mix(in srgb, var(--highlightColor) 40%, hsl(var(--foreground)/var(--un-text-opacity, 1)));
            color: var(--highlight-fg, hsl(var(--primary) / var(--un-text-opacity))) !important;
        }

        &::before {
            /* background-color: hsl(var(--primary) / var(--un-bg-opacity)); */
            /* [Somnia-fix] doc aside style */
            background-color: var(--highlightColor, hsl(var(--primary) / var(--un-text-opacity))) !important;
        }
    }
</style>
