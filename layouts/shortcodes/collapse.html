{{ $title := .Get "title" | default "点击展开" }}

<div class="border border-border rounded-lg overflow-hidden">
  <button
    class="w-full flex items-center justify-between px-4 py-3 text-left font-medium hover:bg-muted transition-colors"
    onclick="const content = this.nextElementSibling;
             const icon = this.querySelector('svg');
             content.classList.toggle('hidden');
             icon.classList.toggle('rotate-180');">
    {{ $title }}
    <svg class="w-4 h-4 transition-transform" fill="none" stroke="currentColor" viewBox="0 0 24 24">
      <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 9l-7 7-7-7"></path>
    </svg>
  </button>
  <div class="p-4 bg-background hidden">
    <div class="prose prose-sm dark:prose-invert max-w-none">
      {{ .Inner | markdownify }}
    </div>
  </div>
</div>
