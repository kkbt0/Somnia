{{ $repo := .Get "repo" }}
{{ $split := split $repo "/" }}
{{ $owner := index $split 0 }}
{{ $repoName := index $split 1 }}

        <div class='min-w-0 flex-1'>
          <div class='flex items-center gap-x-1 max-sm:flex-wrap'>
            <span class='truncate text-base transition-colors sm:text-lg'>{{ $owner }}</span>
            <span class='text-muted-foreground max-sm:hidden'>/</span>
            <span class='truncate text-base font-medium transition-colors sm:text-lg max-sm:w-full'>{{$repoName}}</span>

<script>
  //   interface GithubProps {
  //   stargazers_count: number  // 星标数
  //   forks_count: number            // Fork 数
  //   language: string         // 主要编程语言
  //   owner: { avatar_url: string }  // 所有者头像 URL
  //   license?: { spdx_id: string }  // 许可证标识（可选）
  //   description: string      // 仓库描述
  // }
  function githubCardComponent() {
    return {
      loading: true,
      repo: '',
      // fetch 变量
      stargazers_count: null,
      forks_count: null,
      language: null,
      owner: { avatar_url: null },
      license: { spdx_id: null },
      description: null,
      initGithubCardComponent(repo) {
        this.repo = repo;
        this.fetchGithub(repo);
      },
      fetchGithub() {
        try {
          fetch(`https://api.github.com/repos/${this.repo}`)
            .then(res => res.json())
            .then(json => {
              this.stargazers_count = json.stargazers_count;
              this.forks_count = json.forks_count;
              this.language = json.language;
              this.owner = json.owner;
              this.license = json.license;
              this.description = json.description;

              this.loading = false;
              // console.log(json);
            });
        } catch (error) {
          console.error(error);
        }
      }
    }
  }
</script>
<style>
  @keyframes pulsate {
    0% {
      opacity: 1;
    }

    50% {
      opacity: 0.4;
    }

    to {
      opacity: 1;
    }
  }

  .loading .load-block {
    color: transparent;
    border-radius: calc(var(--radius) - 3px);
    background-color: hsl(var(--card) / var(--un-bg-opacity, 1));
    animation: pulsate 2s infinite linear;
    user-select: none;
  }

  .loading .load-block:nth-child(2) {
    animation-delay: 1s;
  }

  .no-license {
    opacity: 0.5;
  }

  :not(.loading) #gh-avatar {
    background-color: hsl(var(--card) / var(--un-bg-opacity));
  }
</style>
