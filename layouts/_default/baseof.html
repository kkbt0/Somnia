<!DOCTYPE html>
<html lang="{{ or site.Language.LanguageCode site.Language.Lang }}" dir="{{ or site.Language.LanguageDirection `ltr` }}"
  style="--highlightColor: #203880;">

<head>
  {{ partial "head.html" . }}
  {{ partial "head/theme.html" . }}
</head>

<body class="flex justify-center bg-background text-foreground">
  <!-- 渐变背景 -->
  {{ partial "bg.html" . }}

  <!-- 主容器 -->
  <div id='main-container' class='w-full max-w-[70rem] min-h-[100dvh] flex flex-col justify-between'>

    {{ partial "header.html" . }}
    <div x-data="component.content()" id="content-wrapper" class="flex-1 w-full transition-fade">
      {{ block "main" . }}{{ end }}
      {{ partial "data.html" . }}
    </div>
    {{ partial "footer.html" . }}
  </div>
</body>

</html>
